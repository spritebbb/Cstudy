# 汉江师范学院 软件工程专业《C 语言程序设计》专升本考试大纲
#
# 来源：汉江师范学院教务处《附件2：2026年普通专升本考试大纲（PDF版）》
#       → 13.软件工程专业普通专升本考试大纲（C语言程序设计）.pdf
# 考试：闭卷笔试，120 分钟，满分 150 分，无选择题、无判断题
# 教材：谭浩强《C程序设计（第五版）》清华大学出版社 2017 年 8 月
#
# 为什么按这所学校的考纲：
#   四所"只考英语 + C语言"的学校（湖北工程学院、武汉商学院、汉江师范学院、
#   湖北师范大学）里，汉江的考纲**范围最大**——包含其余三所的全部内容，
#   另多出"预处理命令"。按它复习，四所都覆盖。
#
# 改完要重新灌库：
#   先清掉 syllabus_points 表（旧考纲的条目不会自动删），再跑
#   python scripts/seed_syllabus.py

- chapter: 第1章 程序设计和C语言
  points:
    - C 语言的简史与特点
    - 简单的 C 程序结构
    - 程序的编辑、编译、链接和运行
    - 在集成开发环境下建立和运行 C 程序
    # 考纲"考试内容"概述里点名了"预处理命令"，但章节列表里没有单独一章，
    # 归到这里（属程序结构范畴）
    - 预处理命令（#define 宏定义、#include 文件包含、条件编译）

- chapter: 第2章 算法——程序的灵魂
  points:
    - 什么是算法和算法的特性
    - 用自然语言表示算法
    - 用流程图表示算法
    - 用 N-S 流程图表示算法
    - 用伪代码表示算法
    - 用计算机语言表示算法

- chapter: 第3章 最简单的C程序设计——顺序程序设计
  points:
    - 关键字与标识符的概念
    - 常量与变量的分类
    - 数据类型的含义与特点
    - 不同类型常量的表示方法
    - 不同类型变量的定义与赋初值
    - 各类运算符的含义与优先级
    - 各类表达式的表示方法、值的类型与混合运算
    - 常用的输入输出函数与基本输入输出格式
    - 赋值语句的功能和表达方法
    - 顺序结构程序的编写

- chapter: 第4章 选择结构程序设计
  points:
    - 条件的表达方式（算术表达式、关系表达式、逻辑表达式）
    - 各种运算结果的表达与判别
    - if 语句
    - if-else 语句
    - else-if 结构
    - switch 语句与 break 语句
    - 选择结构程序的编写

- chapter: 第5章 循环结构程序设计
  points:
    - while 循环的格式与循环条件
    - do-while 循环的格式与循环条件
    - for 循环的格式与循环条件
    - 循环结构中 break 语句的使用
    - 循环结构中 continue 语句的使用
    - 循环程序的编写

- chapter: 第6章 利用数组处理批量数据
  points:
    - 数组的概念
    - 一维数组的定义、初始化与元素引用
    - 二维数组的定义、初始化与元素引用
    - 字符数组与字符串操作
    - 基于数组的程序设计方法

- chapter: 第7章 用函数实现模块化程序设计
  points:
    - 函数定义的格式（类型、参数、返回值）
    - 函数的调用
    - 形式参数与返回值
    - 递归函数的定义和调用
    - 局部变量与全局变量的定义方法和声明形式
    - 存储类别的含义与使用方法
    - 内部函数与外部函数

- chapter: 第8章 善于利用指针
  points:
    - 指针的概念、类型与分类
    - 指针变量的基本使用
    - 用指针处理变量
    - 用指针处理数组
    - 用指针处理字符串
    - 用指针处理函数
    - 指针数组与多重指针
    - 动态内存分配

- chapter: 第9章 用户自己建立数据类型
  points:
    - 结构体的含义与类型声明
    - 共用体的含义与类型声明
    - 结构体与共用体变量的定义、初始化与引用
    - 枚举类型的定义和使用
    - 用指针处理链表

- chapter: 第10章 对文件的输入输出
  points:
    - 文件的概念、定义、分类和特点
    - 文件的打开与关闭
    - 文件的读/写操作
    - 文件定位
    - 文件出错检测
