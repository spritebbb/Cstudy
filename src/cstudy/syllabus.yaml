# 专升本 C 语言考纲知识点
#
# 这是初始数据，可以直接改。改完重新运行 python scripts/seed_syllabus.py 即可生效。
# 已经存在的知识点会更新章节，不会重复插入，也不会删掉你手动加的内容。
#
# 格式：
#   - chapter: 章节名
#     points:
#       - 知识点1
#       - 知识点2

- chapter: C 语言概述
  points:
    - C 程序的基本结构（预处理、函数、语句）
    - main 函数的地位与返回值
    - 编译、链接与运行过程
    - 源程序、目标程序与可执行文件
    - 注释的写法与作用
    - 标识符命名规则
    - 关键字与保留字
    - 程序的书写格式与风格

- chapter: 数据类型、运算符与表达式
  points:
    - 基本数据类型（int、float、double、char）
    - 常量与变量的定义
    - 整型数据的表示范围与溢出
    - 浮点型数据的精度与表示
    - 字符型数据与 ASCII 码
    - 转义字符
    - 算术运算符与算术表达式
    - 自增自减运算符（++、--）的前后置区别
    - 赋值运算符与复合赋值运算符
    - 逗号运算符与逗号表达式
    - 关系运算符与关系表达式
    - 逻辑运算符与短路求值
    - 条件运算符（三目运算符）
    - 运算符的优先级与结合性
    - 强制类型转换与自动类型转换

- chapter: 顺序结构程序设计
  points:
    - 赋值语句
    - 输入输出函数 printf 的格式控制
    - 格式字符（%d、%f、%c、%s、%x 等）
    - 输入函数 scanf 的用法与注意事项
    - 字符输入输出函数 getchar 与 putchar
    - 常见输入输出格式错误

- chapter: 选择结构程序设计
  points:
    - if 语句的三种形式
    - if-else 的配对与嵌套
    - 条件表达式的真假判断
    - switch 语句的语法与执行流程
    - break 在 switch 中的作用
    - switch 与 if 的选择
    - 嵌套选择结构的程序设计

- chapter: 循环结构程序设计
  points:
    - while 循环
    - do-while 循环及其与 while 的区别
    - for 循环的三个表达式
    - 循环的嵌套
    - break 语句的作用
    - continue 语句的作用
    - break 与 continue 的区别
    - 循环终止条件的判断
    - 常见循环算法（累加、累乘、求素数、求最大公约数）

- chapter: 数组
  points:
    - 一维数组的定义与初始化
    - 一维数组元素的引用
    - 数组下标越界问题
    - 一维数组的遍历与常见算法
    - 二维数组的定义与初始化
    - 二维数组元素的引用与遍历
    - 字符数组与字符串
    - 字符串结束标志 '\0'
    - 字符串处理函数（strlen、strcpy、strcat、strcmp）
    - 字符串的输入输出

- chapter: 函数
  points:
    - 函数的定义与调用
    - 函数的返回值与 return 语句
    - 函数参数的值传递
    - 形参与实参
    - 函数的声明与原型
    - 局部变量与全局变量
    - 变量的存储类别（auto、static、register、extern）
    - 静态局部变量的特性
    - 函数的嵌套调用
    - 函数的递归调用
    - 数组作为函数参数
    - 变量的作用域与生存期

- chapter: 指针
  points:
    - 指针变量的定义与初始化
    - 取地址运算符 & 与解引用运算符 *
    - 指针与变量的关系
    - 指针作为函数参数
    - 指针与数组的关系
    - 通过指针引用数组元素
    - 指针的算术运算
    - 字符串与字符指针
    - 指向字符串的指针与字符数组的区别
    - 指针数组
    - 指向指针的指针
    - 返回指针的函数
    - 函数指针与指向函数的指针
    - 空指针与野指针

- chapter: 结构体与共用体
  points:
    - 结构体类型的定义
    - 结构体变量的定义与初始化
    - 结构体成员的引用
    - 结构体数组
    - 指向结构体的指针
    - 结构体作为函数参数
    - 共用体类型的定义与使用
    - 共用体与结构体的区别
    - 枚举类型
    - 用 typedef 定义类型别名

- chapter: 文件
  points:
    - 文件指针 FILE 类型
    - 文件的打开与关闭（fopen、fclose）
    - 文件打开方式（r、w、a、rb、wb 等）
    - 字符读写函数（fgetc、fputc）
    - 字符串读写函数（fgets、fputs）
    - 格式化读写函数（fscanf、fprintf）
    - 数据块读写函数（fread、fwrite）
    - 文件定位函数（rewind、fseek、ftell）
    - 文件结束判断 feof

- chapter: 编译预处理
  points:
    - 宏定义 #define 与宏替换
    - 带参数的宏定义
    - 宏与函数的区别
    - 文件包含 #include
    - 条件编译 #if、#ifdef、#ifndef

- chapter: 位运算
  points:
    - 按位与、按位或、按位异或
    - 按位取反
    - 左移与右移运算
    - 位运算的常见应用
