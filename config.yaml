# 非敏感配置。密钥一律放 .env，不要写在这里。

app:
  name: C语言备考助手

paths:
  database: data/cstudy.db
  notes: notes
  logs: logs
  cookies: data/cookies/bilibili.json
  audio: data/audio

ai:
  provider: deepseek
  base_url: https://api.deepseek.com
  # deepseek-flash：100 万上下文，同时支持文字和图片输入
  model: deepseek-flash
  timeout_seconds: 180
  max_retries: 3
  retry_backoff_seconds: 5
  temperature: 0.3
  # 单次请求最多送多少字字幕，防止请求体过大
  max_chars_per_chunk: 6000

notes:
  # 字幕按多少分钟切一块，逐块生成小结再合并
  chunk_minutes: 10
  # 少于这个字数就不切块，直接一次性生成
  min_chunk_chars: 200

quiz:
  # 出题数量：
  #   auto = 让 AI 按这节课的内容多少自己定（推荐）
  #   数字 = 固定出这么多道，比如 8
  count: auto

  # count 为 auto 时生效。内容少就少出，但不会少到没法练；
  # 内容多就多出，但不会一下子冒出几十道。
  min_count: 5
  max_count: 12

  # 各题型的偏好。只是给 AI 的参考比例，不是硬性数量——
  # 哪节适合多出编程题，把 coding 调大一点即可。
  prefer:
    choice: 3
    fill: 2
    reading: 1
    coding: 1

# 生成完笔记和题目后，让 AI 再复查一遍：
# 答案错的自动改，广告题和废题自动删，并告诉你删了哪几道、为什么。
# 关掉能省一次 AI 调用，但内容就没人把关了。
review:
  enabled: true
  # 复查题目时，送给 AI 的笔记最多多少字（超长笔记会截断，避免请求过大）
  max_note_chars: 8000
  # 复查笔记时，送给 AI 的原始字幕最多多少字
  max_source_chars: 40000

transcribe:
  # 没有 CC 字幕时，是否用本地 whisper 转写
  enabled: true
  # tiny / base / small / medium / large-v3，越大越准也越慢
  model_size: small
  # auto 会优先用显卡，装不上 CUDA 就自动退回 CPU
  device: auto
  # auto 会按 device 自动选择 cuda:float16 或 cpu:int8
  compute_type: auto
  language: zh

bilibili:
  request_timeout: 30
  max_retries: 3

logging:
  level: INFO
  file: logs/cstudy.log
  max_bytes: 5242880
  backup_count: 3
