# 非敏感配置。密钥一律放 .env，不要写在这里。

app:
  name: C语言备考助手

paths:
  database: data/cstudy.db
  notes: notes
  logs: logs
  cookies: data/cookies/bilibili.json
  audio: data/audio
  # 关键帧：抽出来的画面存在这里（视频本体抽完就删，帧留着方便回看）
  frames: data/frames

ai:
  provider: deepseek
  base_url: https://api.deepseek.com
  # deepseek-flash：100 万上下文，同时支持文字和图片输入
  model: deepseek-flash
  timeout_seconds: 180
  max_retries: 3
  retry_backoff_seconds: 5
  temperature: 0.3
  # 单次请求最多送多少字字幕，防止请求体过大
  max_chars_per_chunk: 6000

notes:
  # 字幕按多少分钟切一块，逐块生成小结再合并
  chunk_minutes: 10
  # 少于这个字数就不切块，直接一次性生成
  min_chunk_chars: 200

quiz:
  # 出题数量：
  #   auto = 让 AI 按这节课的内容多少自己定（推荐）
  #   数字 = 固定出这么多道，比如 8
  count: auto

  # count 为 auto 时生效。内容少就少出，但不会少到没法练；
  # 内容多就多出，但不会一下子冒出几十道。
  min_count: 5
  max_count: 12

  # 题型。填 0 的题型**不会出**——这是限定，不是参考。
  # 湖北专升本这几所目标学校（湖北工程学院、武汉商学院、汉江师范学院、
  # 湖北师范大学）都写明"无选择题、无判断题"，所以选择题设成 0。
  # 比例按湖北工程学院的题型分值折算（它是唯一公布题型分值的）：
  #   填空 48 + 程序填空 36 = 84 分  → 5 道
  #   程序阅读 35 分                 → 2 道
  #   程序设计 31 分                 → 2 道
  prefer:
    choice: 0
    fill: 5
    reading: 2
    coding: 2

# 「组一套真题」：从题库里按考试题型分值挑题拼一套卷子。
# 跟上面的 quiz 段不是一回事——上面是**从笔记生成新题**（要调 AI），
# 这里是**从已有的题里挑**（不调 AI，不花钱）。
exam:
  # 一套卷子要多少道题。按下面的比例分配。
  total_questions: 20

  # 题型分值比例，来自湖北工程学院公布的：填空 48 / 程序阅读 35 /
  # 程序填空 36 / 程序设计 31。
  #
  # 注意：考试是**四类**，但库里的题型只有**三类**——"填空"和"程序填空"
  # 都归到了 fill（48+36=84）。以后要分开统计，得先给 questions 加题型字段。
  ratios:
    fill: 84
    reading: 35
    coding: 31

# 生成完笔记和题目后，让 AI 再复查一遍：
# 答案错的自动改，广告题和废题自动删，并告诉你删了哪几道、为什么。
# 关掉能省一次 AI 调用，但内容就没人把关了。
review:
  enabled: true
  # 复查题目时，送给 AI 的笔记最多多少字（超长笔记会截断，避免请求过大）
  max_note_chars: 8000
  # 复查笔记时，送给 AI 的原始字幕最多多少字
  max_source_chars: 40000

# 错题本：做错的题按遗忘曲线安排复习。
# 做错的题一直在记（记错了几次、最近一次什么时候错的），这里定的是
# "隔多久该再看一遍"和"什么时候算学会"。
wrong_book:
  # 错第 1 次隔 1 天复习，第 2 次 3 天，第 3 次 7 天，第 4 次起都是 15 天。
  # 错得越多说明越不熟，但也不该天天刷同一道——间隔拉开才叫遗忘曲线。
  review_intervals: [1, 3, 7, 15]

  # 连续答对这么多次就算掌握，不再出现在「今天该复习」里。
  # 注意是**连续**：中间错一次就重新数。
  master_after_correct: 2

# 导入现成题库（粘贴文字那份）。
# 粘贴的文字按题号切成几段分别解析——切太大会超出单次返回的长度，
# 切太小又浪费调用次数。8000 字大约 20~30 道题。
import:
  max_chars_per_call: 8000

  # 导入时过滤掉这些题型。默认过滤选择题——湖北专升本这几所都不考，
  # 但市面上的题库几乎都有选择题，不过滤会混进来一堆考不到的。
  # 注意是"先让 AI 全部解析出来、再在代码里过滤"，
  # 所以过滤掉几道会如实报给你核对，不会悄悄少题。
  skip_types:
    - choice

transcribe:
  # 没有 CC 字幕时，是否用本地 whisper 转写
  enabled: true
  # tiny / base / small / medium / large-v3，越大越准也越慢
  model_size: small
  # auto 会优先用显卡，装不上 CUDA 就自动退回 CPU
  device: auto
  # auto 会按 device 自动选择 cuda:float16 或 cpu:int8
  compute_type: auto
  language: zh

# 关键帧：把视频里**屏幕上写的代码和 PPT** 也读进笔记。
# 字幕只记了老师说的话，屏幕上写的东西字幕里没有——对 C 语言课来说那是大头。
#
# **默认关闭**。技术上跑得通（实测 AI 能把 VS 编辑器里的代码和 PPT 一字不差读出来），
# 但每生成一份笔记都要多下一次视频 + 多几次 AI 看图调用，而题库里已经有一千多道
# 真题带着代码了——想看代码直接刷题更划算。哪一集真想看屏幕内容，把它改成 true。
frames:
  enabled: false

  # 画面变化超过这个阈值就算"新画面"。0.3 实测够用：太小会抽出一堆几乎一样的帧
  # 白花钱，太大又会漏掉切屏。
  scene_threshold: 0.3

  # 一部视频最多读这么多帧（超了就均匀挑）。帧数直接决定多花多少钱。
  max_frames: 60

  # 一次送几张给 AI 看
  per_call: 8

  # 抽帧时缩到这个宽度再存。960 够看清代码，单帧约 33KB。
  width: 960

  # 下载清晰度上限。480p 足够看清屏幕上的字，文件还小。
  max_height: 480

bilibili:
  request_timeout: 30
  max_retries: 3

logging:
  level: INFO
  file: logs/cstudy.log
  max_bytes: 5242880
  backup_count: 3
